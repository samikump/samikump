name: Generate Profile Stats Cards
on:
  schedule: [{cron: "0 0 * * *"}] # Automatically refreshes every day at midnight
  workflow_dispatch: # Allows you to manually trigger it anytime

jobs:
  build-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Language Distribution and Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          filename: github-metrics.svg
