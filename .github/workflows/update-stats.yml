name: Generate Classic Profile Stats Cards
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-classic-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Classic Stats Card
        uses: anuraghazra/github-readme-stats-github-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: samikump
          theme: radial
          show_icons: true
          output_stats: classic-stats.svg
          output_languages: classic-languages.svg
